<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Emergent Application List</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 3rem 3.5rem;
    max-width: 520px;
    width: 100%;
  }

  .logo {
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a2e1a;
    margin-bottom: 0.35rem;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #6b7a6b;
    margin-bottom: 2.5rem;
  }

  .drop-zone {
    border: 2px dashed #a8c5a8;
    border-radius: 10px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.dragover {
    background: #f2faf2;
    border-color: #4a8a4a;
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .drop-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

  .drop-label {
    font-size: 0.95rem;
    color: #3a5a3a;
    font-weight: 500;
  }

  .drop-hint {
    font-size: 0.8rem;
    color: #8a9a8a;
    margin-top: 0.3rem;
  }

  #file-name {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #4a7a4a;
    font-weight: 500;
    min-height: 1.2em;
  }

  .btn {
    display: block;
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.85rem;
    background: #2d6a2d;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }

  .btn:hover { background: #1e4e1e; }
  .btn:disabled { background: #a0bea0; cursor: not-allowed; }

  .error {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    background: #fff0f0;
    border: 1px solid #f5c5c5;
    border-radius: 8px;
    color: #b00;
    font-size: 0.88rem;
  }

  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌿</div>
  <h1>Pre-Emergent Application List</h1>
  <p class="subtitle">Upload your TimeSaver inventory export to generate a route-optimized application list.</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/process" enctype="multipart/form-data" id="upload-form">
    <div class="drop-zone" id="drop-zone">
      <input type="file" name="file" id="file-input" accept=".csv">
      <div class="drop-icon">📄</div>
      <div class="drop-label">Drop your CSV here or click to browse</div>
      <div class="drop-hint">TimeSaver inventory export (.csv)</div>
    </div>
    <div id="file-name"></div>
    <button type="submit" class="btn" id="submit-btn" disabled>
      <span id="btn-text">Generate List</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>
</div>

<script>
  const input = document.getElementById('file-input');
  const fileNameEl = document.getElementById('file-name');
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');
  const dropZone = document.getElementById('drop-zone');

  input.addEventListener('change', () => {
    if (input.files.length) {
      fileNameEl.textContent = '✓ ' + input.files[0].name;
      btn.disabled = false;
    }
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      fileNameEl.textContent = '✓ ' + e.dataTransfer.files[0].name;
      btn.disabled = false;
    }
  });

  document.getElementById('upload-form').addEventListener('submit', () => {
    btnText.style.display = 'none';
    spinner.style.display = 'block';
    btn.disabled = true;
  });
</script>
</body>
</html>
